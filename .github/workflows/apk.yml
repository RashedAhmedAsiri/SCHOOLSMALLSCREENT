name: Build Android APK

# The APK is a thin full-screen shell that loads the live GitHub Pages site,
# so pushing changes to the web app updates the APK too. You only need to
# rebuild it if you change files in android/ (name, icon, settings).
on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/apk.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3

      - name: Point the app at this repo's GitHub Pages URL
        working-directory: android
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          REPO="${GITHUB_REPOSITORY#*/}"
          if [ "$REPO" = "${OWNER}.github.io" ]; then URL="https://${OWNER}.github.io/"; else URL="https://${OWNER}.github.io/${REPO}/"; fi
          echo "Site URL: $URL"
          node -e "const f='capacitor.config.json';const c=require('./'+f);c.server.url=process.argv[1];require('fs').writeFileSync(f,JSON.stringify(c,null,2))" "$URL"
          cat capacitor.config.json

      - name: Create Android project
        working-directory: android
        run: |
          npm install
          npx cap add android
          npx @capacitor/assets generate --android --iconBackgroundColor '#0b5fa8' --splashBackgroundColor '#0b5fa8' || echo "icon generation skipped"
          # full screen + keep screen on for the kiosk
          node scripts/patch-android.js
          npx cap sync android

      - name: Build APK
        working-directory: android/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../../school-screen.apk

      - uses: actions/upload-artifact@v4
        with:
          name: school-screen-apk
          path: school-screen.apk

      - name: Publish to the "latest APK" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Latest Android APK
          body: |
            Download **school-screen.apk** below and open it on the Android device / touch screen to install.
            The app loads the live website, so updates you push to GitHub appear automatically.
          files: school-screen.apk
          make_latest: true
