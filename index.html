<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>ثانوية الموهوبين التقنية</title>
  <meta name="description" content="شاشة تفاعلية لثانوية الموهوبين التقنية">
  <meta name="theme-color" content="#ffffff">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icons/icon-192.png">
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Frutiger Aero sky: gradient + light rays + floating bubbles -->
  <div class="sky" aria-hidden="true">
    <div class="rays"></div>
    <div class="aurora"></div>
    <div class="bubbles"></div>
  </div>

  <header class="topbar">
    <button class="glass-chip home-btn" id="homeBtn" aria-label="الرئيسية" hidden>
      <svg viewBox="0 0 24 24" width="34" height="34" aria-hidden="true"><path fill="currentColor" d="M12 3 2 12h3v8h6v-6h2v6h6v-8h3z"/></svg>
      <span>الرئيسية</span>
    </button>
    <div class="brand">
      <span class="brand-dot"></span>
      <span>ثانوية الموهوبين التقنية</span>
    </div>
    <div class="clock glass-chip" id="clock"></div>
  </header>

  <main id="view" class="view"></main>

  <script src="js/config.js"></script>
  <script src="js/pages.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
