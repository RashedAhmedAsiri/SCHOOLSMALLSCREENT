<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>ثانوية الموهوبين التقنية</title>
  <meta name="description" content="شاشة تفاعلية لثانوية الموهوبين التقنية">
  <meta name="theme-color" content="#ffffff">
  <meta name="mobile-web-app-capable" content="yes">

<body>
  <!-- liquid shapes moving behind the glass -->
  <div class="backdrop" aria-hidden="true">
    <span class="liquid l1"></span><span class="liquid l2"></span><span class="liquid l3"></span><span class="liquid l4"></span><span class="liquid l5"></span>

      <span>الرئيسية</span>
    </button>
    <span></span>
    <div class="clock glass pill-btn" id="clock"></div>

  <main id="view" class="view"></main>

  <script src="js/pages.js"></script>
